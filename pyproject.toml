[project]
name = "passe"
dynamic = ["version"]
description = "Fast CDP browser automation — the kitchen pass for Chrome"
requires-python = ">=3.11"
dependencies = [
    "websockets>=17.0.1",
    "trafilatura>=2.0",
    "httpx>=0.28.0",
]

[project.scripts]
passe = "passe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = "\"version\":\\s*\"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/passe"]
