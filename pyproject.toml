[project]
name = "passe"
version = "0.1.0"
description = "Fast CDP browser automation — the kitchen pass for Chrome"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
]

[project.scripts]
passe = "passe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passe"]
